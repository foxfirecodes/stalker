[package]
name = "stalker"
version = "0.1.0"
edition = "2024"
default-run = "stalker"

[workspace]
members = ["crates/watch", "xtask"]
default-members = ["."]
resolver = "3"

[features]
remote-agent = []

[[bin]]
name = "stalker"
path = "src/main.rs"

[[bin]]
name = "stalker-agent"
path = "src/bin/stalker-agent.rs"
required-features = ["remote-agent"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossbeam-channel = "0.5"
globset = "0.4"
signal-hook = "0.3"
sha2 = "0.10"
stalker-watch = { path = "crates/watch" }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.14"
